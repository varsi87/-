<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>پنل اختصاصی وبگردی TR (ویژه همراه اول) | PUBGメAZVIX</title>
<style>
:root{--accent:#10b981;--accent2:#3b82f6;--card:rgba(12,18,34,0.95);--text:#e2e8f0;--muted:#94a3b8;--border:#10b98155}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(145deg,#030712,#0f172a);color:var(--text);min-height:100vh;line-height:1.65;padding:14px}
.wrap{max-width:780px;margin:0 auto}
header{text-align:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px}
header h1{font-size:1.3rem;background:linear-gradient(90deg,var(--accent),#60a5fa,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:1px solid var(--accent);border-radius:999px;font-size:0.75rem;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.nav button{padding:10px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;font-weight:700;font-size:0.88rem;font-family:inherit}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#10b98133,#3b82f628);border-color:var(--accent)}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:1.05rem;color:var(--accent);margin-bottom:10px}
label{display:block;font-size:0.82rem;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:10px;background:#0a1020;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem}
textarea{min-height:70px;font-family:monospace;font-size:0.75rem;direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{padding:11px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;margin:3px;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#030712}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-d{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5}
.btn-s{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#86efac}
.btn-w{background:rgba(245,158,11,0.15);border:1px solid #f59e0b;color:#fcd34d}
.btn-g{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.cfg{background:rgba(10,16,32,0.8);border-radius:12px;padding:12px;margin:10px 0;border:1px solid rgba(255,255,255,0.08)}
.cfg strong{color:var(--accent)}
.meta{font-size:0.84rem;color:var(--muted);line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0a1220;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:99;opacity:0;transition:0.3s;font-weight:600;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.quota{height:8px;border-radius:999px;background:#0f172a;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,0.08)}
.quota>div{height:100%;border-radius:999px;background:var(--accent);transition:0.3s}
.owner{color:#a78bfa;font-size:0.85rem;font-weight:700}
.note{font-size:0.78rem;color:var(--muted);margin-top:10px;padding:10px;background:rgba(16,185,129,0.1);border-radius:8px;border-right:3px solid var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌐 پنل اختصاصی وبگردی TR (تضمینی)</h1>
    <p style="color:var(--muted);margin-top:6px;font-size:0.9rem">پایه اصلی: کانفیگ تست شده و سالم | PUBGメAZVIX</p>
    <span class="badge">مالک PUBGメAZVIX</span>
  </header>

  <div class="nav">
    <button type="button" class="active" data-tab="dash">📊 داشبورد</button>
    <button type="button" data-tab="create">➕ ساخت کانفیگ</button>
    <button type="button" data-tab="configs">📂 کانفیگ‌ها</button>
    <button type="button" data-tab="sub">🔗 لینک ساب</button>
  </div>

  <div id="tab-dash" class="tab active">
    <div class="card">
      <h2>📊 وضعیت پنل وبگردی TR</h2>
      <div class="meta" id="statusMeta">...</div>
      <div class="quota"><div id="quotaFill" style="width:0%"></div></div>
      <div id="dashList" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="tab-create" class="tab">
    <div class="card">
      <h2>➕ ساخت کانفیگ وبگردی TR</h2>
      <div class="row">
        <div><label>روز اعتبار</label><input type="number" id="cfgDays" min="1" max="365" value="30"/></div>
        <div><label>حجم دلخواه (گیگ)</label><input type="number" id="cfgGB" min="1" max="50000" value="100"/></div>
        <div><label>نام کاربر</label><input type="text" id="cfgName" placeholder="TR_Web_User"/></div>
      </div>
      <div style="margin-top:12px"><button type="button" class="btn btn-p" id="btnCreate">✨ ساخت + دانلود</button></div>
    </div>
  </div>

  <div id="tab-configs" class="tab">
    <div class="card">
      <h2>📂 کانفیگ‌های فعال</h2>
      <div id="cfgList"></div>
    </div>
  </div>

  <div id="tab-sub" class="tab">
    <div class="card">
      <h2>🔗 لینک سابسکریپشن</h2>
      <p class="meta">لینک ساب برای وارد کردن در نرم‌افزارها:</p>
      <input type="text" id="subHttps" readonly placeholder="هنوز ساخته نشده" style="direction:ltr;text-align:left;color:#86efac;font-family:monospace;font-size:0.85rem"/>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        <button type="button" class="btn btn-p" id="btnSubLatest">🚀 لینک آخرین کانفیگ</button>
        <button type="button" class="btn btn-g" id="btnSubAll">📦 لینک همه فعال‌ها</button>
        <button type="button" class="btn btn-o" id="btnCopySub">📋 کپی لینک</button>
      </div>
      <div class="note">سازگار کامل با همراه اول. مالک: PUBGメAZVIX</div>
      <div id="subCfgList" style="margin-top:14px"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var PANEL = { "totalGB": 50000 };
  
  // دقیقاً مشخصات کانفیگ کارکشته و سالم شما (TR)
  var TR_CONFIG = {
    priv: "+LBFoYbszQqVft7++p1W04GPOq7OOig34QyuD+pbnW8=",
    addr: "10.0.0.8",
    dns: "1.1.1.2, 1.0.0.2",
    mtu: "1380",
    pub: "d1qdo2tRvHgNdWLQSs0/3EfczuepNGlneRdoFJTwSgU=",
    psk: "I/ALsuKwHu6UWKoXW1txrefmErLmAbPHZZErPSVYlQY=",
    allowed: "0.0.0.0/0, ::/0",
    endpoint: "w.xorfuno.ir:58855"
  };

  var STORAGE_KEY = "wg_wireguard_tr_only_v1";
  var CONFIGS = [];
  var CONSUMED = 0;
  var LAST_SUB_URL = "";

  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  function switchTab(id) {
    document.querySelectorAll(".nav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === id);
    });
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    var el = document.getElementById("tab-" + id);
    if (el) el.classList.add("active");
    if (id === "dash") renderDash();
    if (id === "configs") renderList();
    if (id === "sub") renderSub();
  }

  document.querySelectorAll(".nav button").forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.getAttribute("data-tab")); });
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        CONFIGS = o.configs || [];
        CONSUMED = Number(o.consumedGB) || 0;
        LAST_SUB_URL = o.httpsSubUrl || "";
      } else {
        var def = buildConf("TR_Web_VIP", 30, 100);
        CONFIGS = [{
          id: "tr_1", name: "TR_Web_VIP", days: 30, gb: 100, usedGB: 0,
          confText: def.conf, createdAt: new Date().toISOString(), expiresAt: new Date(Date.now()+30*86400000).toISOString(), inSub: true, httpsSubUrl: null
        }];
        CONSUMED = 100;
        save();
      }
    } catch (e) { CONFIGS = []; CONSUMED = 0; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ configs: CONFIGS, consumedGB: CONSUMED, httpsSubUrl: LAST_SUB_URL }));
  }

  function remainingDays(cfg) {
    if (!cfg) return 0;
    var endMs = cfg.expiresAt ? new Date(cfg.expiresAt).getTime() : new Date(cfg.createdAt).getTime() + (Number(cfg.days)||30)*86400000;
    var left = Math.ceil((endMs - Date.now()) / 86400000);
    return left > 0 ? left : 0;
  }

  function isActive(cfg) {
    if (!cfg || cfg.inSub === false) return false;
    if (remainingDays(cfg) <= 0) return false;
    return Math.max(0, (Number(cfg.gb)||0) - (Number(cfg.usedGB)||0)) > 0;
  }

  function buildConf(name, days, gb) {
    var safe = String(name).replace(/[^\x20-\x7E]/g,"_").slice(0,40);
    var conf = [
      "# Name = " + safe,
      "# Volume = " + gb + " GB",
      "# Time = " + days + " days",
      "",
      "[Interface]",
      "PrivateKey = " + TR_CONFIG.priv,
      "Address = " + TR_CONFIG.addr + "/32",
      "DNS = " + TR_CONFIG.dns,
      "MTU = " + TR_CONFIG.mtu,
      "",
      "[Peer]",
      "PublicKey = " + TR_CONFIG.pub,
      "PresharedKey = " + TR_CONFIG.psk,
      "AllowedIPs = " + TR_CONFIG.allowed,
      "Endpoint = " + TR_CONFIG.endpoint,
      "PersistentKeepalive = 15",
      ""
    ].join("\n");
    return { conf: conf };
  }

  function downloadText(text, filename) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ toast("✅ کپی شد"); }).catch(function(){ fallback(text); });
    else fallback(text);
  }

  function fallback(text) {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("✅ کپی شد"); } catch(e) { toast("❌ کپی نشد"); }
    document.body.removeChild(ta);
  }

  function updateStatus() {
    var total = PANEL.totalGB;
    var used = Math.max(0, Number(CONSUMED)||0);
    var rem = Math.max(0, total - used);
    var act = CONFIGS.filter(isActive).length;
    var statusMeta = document.getElementById("statusMeta");
    if (statusMeta) {
      statusMeta.innerHTML =
        "وضعیت سرور: 🌐 TR وبگردی (تضمینی همراه اول)<br>"+
        "حجم مصرفی: <strong style='color:#10b981'>" + used + "</strong> / " + total + " GB — باقی‌مانده: <strong>" + rem + "</strong> GB<br>"+
        "کانفیگ‌های فعال: <strong>" + act + "</strong> / " + CONFIGS.length + "<br><span class='owner'>مالک PUBGメAZVIX</span>";
    }
    var pct = Math.min(100, Math.round((used/total)*100));
    var fill = document.getElementById("quotaFill");
    if (fill) fill.style.width = pct + "%";
  }

  function cfgButtons(cfg, i, on) {
    return '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'+
      '<button type="button" class="btn '+(cfg.inSub!==false?"btn-d":"btn-s")+'" data-a="toggle" data-i="'+i+'">'+(cfg.inSub!==false?"🔴 غیرفعال":"🟢 فعال")+'</button>'+
      '<button type="button" class="btn btn-p" data-a="dl" data-i="'+i+'"'+(on?"":" disabled")+'>⬇️ دانلود</button>'+
      '<button type="button" class="btn btn-o" data-a="copy" data-i="'+i+'"'+(on?"":" disabled")+'>📋 کپی</button>'+
      '<button type="button" class="btn btn-o" data-a="qr" data-i="'+i+'"'+(on?"":" disabled")+'>📱 QR</button>'+
      '<button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'">🔗 ساب</button>'+
      '<button type="button" class="btn btn-d" data-a="del" data-i="'+i+'">🗑️</button></div>';
  }

  function renderList() {
    updateStatus();
    var list = document.getElementById("cfgList");
    if (!list) return;
    if (!CONFIGS.length) { list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:16px">کانفیگی ساخته نشده</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      var left = remainingDays(cfg);
      html += '<div class="cfg" style="opacity:'+(on?1:0.55)+'"><strong>🌐 TR — '+(cfg.name||("#"+(i+1)))+'</strong><br>'+
        '<span style="font-size:0.82rem;color:var(--muted)">اعتبار: '+left+' روز • حجم: '+(cfg.gb||100)+' گیگ</span>'+cfgButtons(cfg,i,on)+'</div>';
    });
    list.innerHTML = html;
  }

  function renderDash() {
    updateStatus();
    var box = document.getElementById("dashList");
    if (!box) return;
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">کانفیگی نیست</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      html += '<div class="cfg"><strong> TR — '+(cfg.name||("#"+(i+1)))+'</strong> — '+(on?"فعال":"غیرفعال")+' | حجم: <span style="color:#10b981">'+(cfg.gb||100)+' GB</span></div>';
    });
    box.innerHTML = html;
  }

  function renderSub() {
    updateStatus();
    var el = document.getElementById("subHttps");
    if (el) { el.value = LAST_SUB_URL || ""; }
    var box = document.getElementById("subCfgList");
    if (!box) return;
    if (!CONFIGS.length) { box.innerHTML = '<p style="color:var(--muted)">کانفیگی نیست</p>'; return; }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      var on = isActive(cfg);
      html += '<div class="cfg"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<span>'+(cfg.name||("#"+(i+1)))+'</span>'+
        '<button type="button" class="btn btn-g" data-a="sub" data-i="'+i+'">🔗 دریافت ساب</button></div></div>';
    });
    box.innerHTML = html;
  }

  function buildSubPageHtml(cfg) {
    var on = isActive(cfg);
    var confData = on ? (cfg.confText || "") : "";
    var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=" + encodeURIComponent(confData ? confData.slice(0,1200) : "INACTIVE");
    return '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>'+
      '<title>ساب TR</title><style>body{font-family:Tahoma;background:#030712;color:#e2e8f0;padding:14px;text-align:center}.card{background:#0f172a;border:1px solid #10b98155;border-radius:16px;padding:16px}.conf{background:#030712;border-radius:12px;padding:12px;font-family:monospace;font-size:11px;direction:ltr;text-align:left;color:#34d399;white-space:pre-wrap}.btn{width:100%;padding:12px;border:none;border-radius:20px;background:#10b981;color:#fff;font-weight:bold;margin:10px 0}</style></head><body>'+
      '<div class="card"><h2>🌐 کانفیگ TR وبگردی</h2><p>مالک: PUBGメAZVIX</p>'+
      '<div class="conf">'+(confData||"غیرفعال").replace(/</g,"&lt;")+'</div>'+
      (on?'<button class="btn" onclick="var c='+JSON.stringify(confData)+';var a=document.createElement(\'a\');a.href=URL.createObjectURL(new Blob([c]));a.download=\'config.conf\';a.click()">دانلود فایل .conf</button>':'')+
      '<div style="background:#fff;padding:10px;border-radius:12px;display:inline-block"><img src="'+qrUrl+'" width="200"/></div>'+
      '</div></body></html>';
  }

  async function uploadHtml(bodyHtml) {
    try {
      var res = await fetch("https://api.pastes.dev/post", { method:"POST", headers:{"Content-Type":"text/html; charset=utf-8"}, body: bodyHtml });
      if (res.ok) { var data = await res.json(); if (data && data.key) return "https://api.pastes.dev/"+data.key; }
    } catch(e) {}
    return null;
  }

  async function createSubFor(i) {
    var cfg = CONFIGS[i];
    if (!cfg) return;
    toast("⏳ ساخت لینک ساب...");
    var body = buildSubPageHtml(cfg);
    var url = await uploadHtml(body);
    if (url) {
      cfg.httpsSubUrl = url; LAST_SUB_URL = url; save();
      var el = document.getElementById("subHttps"); if (el) el.value = url;
      copyText(url); toast("✅ لینک ساب کپی شد"); renderSub();
    } else {
      window.open(URL.createObjectURL(new Blob([body],{type:"text/html;charset=utf-8"})), "_blank");
      toast("⚠ صفحه ساب باز شد");
    }
  }

  function createConfig() {
    var days = parseInt(document.getElementById("cfgDays").value,10)||30;
    var gb = parseInt(document.getElementById("cfgGB").value,10)||100;
    var name = (document.getElementById("cfgName").value||"").trim() || ("TR_User_" + (CONFIGS.length+1));
    var built = buildConf(name, days, gb);
    CONFIGS.unshift({
      id: "cfg_"+Date.now().toString(36), name: name, days: days, gb: gb, usedGB: 0,
      confText: built.conf, createdAt: new Date().toISOString(), expiresAt: new Date(Date.now()+days*86400000).toISOString(), inSub: true, httpsSubUrl: null
    });
    CONSUMED += gb;
    save(); renderList(); renderDash(); renderSub();
    downloadText(built.conf, name.replace(/[^a-zA-Z0-9]/g,"_")+".conf");
    toast("✅ کانفیگ TR ساخته شد");
    switchTab("configs");
  }

  function handleAction(a, i) {
    var cfg = CONFIGS[i];
    if (!cfg) return;
    if (a === "dl") downloadText(cfg.confText, (cfg.name||"config")+".conf");
    else if (a === "copy") copyText(cfg.confText||"");
    else if (a === "qr") window.open("https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent((cfg.confText||"").slice(0,1200)), "_blank");
    else if (a === "toggle") { cfg.inSub = !(cfg.inSub !== false); save(); renderAll(); }
    else if (a === "del") { CONFIGS.splice(i,1); save(); renderAll(); }
    else if (a === "sub") createSubFor(i);
  }

  function renderAll() { renderList(); renderDash(); renderSub(); }

  var btnCreate = document.getElementById("btnCreate");
  if (btnCreate) btnCreate.addEventListener("click", function(e){ e.preventDefault(); createConfig(); });

  var btnSubCopy = document.getElementById("btnCopySub");
  if (btnSubCopy) btnSubCopy.addEventListener("click", function(){
    var v = document.getElementById("subHttps").value;
    if (v) copyText(v); else toast("ابتدا ساب بسازید");
  });

  document.body.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-a]");
    if (!btn || btn.disabled) return;
    handleAction(btn.getAttribute("data-a"), parseInt(btn.getAttribute("data-i"), 10));
  });

  load(); renderAll();
  toast("پنل اختصاصی TR آماده است!");
})();
</script>
</body>
</html>
